<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intelligence Platform – Family Card Viewer</title>
  <meta name="description" content="Sistem intelijen terpadu untuk verifikasi data kependudukan dan kartu keluarga berbasis telemetri aman." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TOP NAV -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo-wrap" id="logo-wrap" style="cursor: pointer;" onclick="window.location.href='search.html'">
        <div class="logo-emblem">
          <img src="images/bnpt_logo.png" alt="BNPT Logo" style="width:34px; height:34px; object-fit:contain; filter:drop-shadow(0 0 4px rgba(226,0,26,0.3));" />
        </div>
      </div>
    </div>

    <div class="topbar-search">
      <button class="btn-back" id="btn-back" onclick="window.location.href='search.html'">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M8.5 1L3 6.5l5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back to results
      </button>

      <div class="search-group active">
        <select class="search-type-select" id="search-type-select" aria-label="Search Type">
          <option value="name" selected>Name</option>
          <option value="phone">Phone Number</option>
          <option value="kk">KK Number</option>
        </select>
        <div class="search-input-wrap">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 9.5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input type="text" id="search-input" class="search-input" value="Aimana Ilman Aulia" placeholder="Search name..." />
        </div>
        <button class="btn-search" id="btn-search">SEARCH</button>
      </div>
    </div>

    <div class="topbar-right">
      <div class="retrieval-info">
        <span class="retrieval-label">Retrieved on</span>
        <span class="retrieval-date" id="retrieval-date">Aug 15, 2026, 05:30 PM</span>
      </div>
      <button class="btn-fullscreen" id="btn-fullscreen" onclick="toggleFullScreen()" title="Fullscreen Mode (F11)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        <span class="fs-text">Fullscreen</span>
      </button>
      <button class="btn-export" id="btn-export">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v7M4 5.5l2.5 2.5 2.5-2.5M1 10.5v.5a1 1 0 001 1h9a1 1 0 001-1v-.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export Data
      </button>
    </div>
  </header>

  <!-- TABS -->
  <nav class="tab-nav" role="navigation" aria-label="Section tabs">
    <div class="tab-nav-inner">
      <button class="tab-btn" id="tab-profile" data-tab="profile" onclick="window.location.href='profile_aimana.html'">Profile Overview</button>
      <button class="tab-btn active" id="tab-family" data-tab="family">Family Card</button>
      <button class="tab-btn" id="tab-phone" data-tab="phone" onclick="window.location.href='phone_detail.html'">Phone Detail</button>
      <button class="tab-btn" id="tab-map" data-tab="map" onclick="window.location.href='map_review.html'">Map Review</button>
      <button class="tab-btn" id="tab-cellular" data-tab="cellular" onclick="window.location.href='cellular_history.html'">Cellular History</button>
      <button class="tab-btn" id="tab-whatsapp" data-tab="whatsapp" onclick="window.location.href='whatsapp_detail.html'">WhatsApp Detail</button>
      <button class="tab-btn" id="tab-data" data-tab="data" onclick="window.location.href='data_usage.html'">Data Usage Activities</button>
      <button class="tab-btn" id="tab-link" data-tab="link" onclick="window.location.href='link_analysis.html'">Link Analysis</button>
      <button class="tab-btn" id="tab-ai" data-tab="ai" onclick="window.location.href='ai_analysis.html'">AI Analysis</button>
    </div>
    <div class="secure-badge" id="secure-badge">
      <span class="pulse-dot"></span>
      SECURE TELEMETRY LINKED
    </div>
  </nav>

  <!-- INFO BAR -->
  <div class="info-bar">
    <span class="info-text">2 phone number(s) found. Fetching full profile&hellip;</span>
  </div>

  <!-- LAYOUT WRAPPER -->
  <div class="layout-wrap">

    <!-- SIDEBAR -->
    <aside class="sidebar" aria-label="Sidebar navigation">
      <button class="sidebar-icon active" id="sb-search" title="Search">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="7.5" cy="7.5" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M12 12l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="sidebar-icon" id="sb-folder" title="Folders">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 5a1 1 0 011-1h5l1.5 2H15a1 1 0 011 1v7a1 1 0 01-1 1H3a1 1 0 01-1-1V5z" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button class="sidebar-icon" id="sb-chart" title="Analytics">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="9" width="4" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="7" y="5" width="4" height="11" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="12" y="2" width="4" height="14" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button class="sidebar-icon" id="sb-doc" title="Reports">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 2h7l4 4v10a1 1 0 01-1 1H4a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5"/><path d="M11 2v4h4M6 9h6M6 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="sidebar-spacer"></div>
      <button class="sidebar-icon" id="sb-help" title="Help">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M9 10v1M9 7a2 2 0 110 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="sidebar-icon" id="sb-settings" title="Settings">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M9 1v2M9 15v2M1 9h2M15 9h2M3.22 3.22l1.42 1.42M13.36 13.36l1.42 1.42M3.22 14.78l1.42-1.42M13.36 4.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- Dataset source -->
      <div class="dataset-bar">
        <span class="dataset-label">DATASET SOURCE</span>
        <span class="dataset-badge">
          <span class="dot-green"></span>
          Telco Dataset (v1) - Ready
        </span>
        <div style="margin-left:auto; display:flex; gap:6px;">
          <button class="btn-refresh" title="Info"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/><path d="M6 5v4M6 3.5v.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
          <button class="btn-refresh" id="btn-refresh" title="Refresh"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 6A5 5 0 1011 6M1 3v3h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>

      <!-- Family Card Header -->
      <div class="kk-header" style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px;">
        <div>
          <div style="font-size:10.5px; font-weight:700; color:var(--accent); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:3px;" id="kk-subtitle">NATIONAL CIVIL REGISTRY</div>
          <h1 class="kk-title" style="margin:0;">FAMILY CARD (KK)</h1>
        </div>
        <div class="kk-meta" style="display:flex; gap:24px; align-items:center;">
          <div style="text-align:right;">
            <div style="font-size:9.5px; font-weight:700; letter-spacing:0.08em; color:var(--text-muted); text-transform:uppercase; margin-bottom:2px;">KK NUMBER</div>
            <div class="kk-number" id="kk-number" style="font-size:14px; font-weight:700; color:var(--text-primary); font-family:var(--mono);">3175060703160026</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:9.5px; font-weight:700; letter-spacing:0.08em; color:var(--text-muted); text-transform:uppercase; margin-bottom:2px;">FAMILY MEMBERS</div>
            <div class="kk-members" id="kk-members" style="font-size:14px; font-weight:700; color:var(--accent); font-family:var(--font);">3 Registered</div>
          </div>
        </div>
      </div>

      <!-- Members Grid -->
      <div class="members-grid" id="members-grid">
        <!-- Cards rendered by JS -->
      </div>

    </main>
  </div>

  <script src="search_logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
